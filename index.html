<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UE5 PBL 完整参考 v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{--bg:#08090e;--c1:rgba(255,255,255,0.03);--c2:rgba(255,255,255,0.055);--bd:rgba(255,255,255,0.07);--t1:#e4e4e7;--t2:#a1a1aa;--t3:#52525b;--blue:#60a5fa;--amber:#f59e0b;--green:#34d399;--purple:#a78bfa;--red:#f87171;--cyan:#22d3ee;--pink:#f0abfc;--sky:#38bdf8;--sand:#d97706;--snow:#94a3b8;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(96,165,250,0.04),transparent 60%),radial-gradient(ellipse 60% 50% at 80% 90%,rgba(167,139,250,0.03),transparent 60%);pointer-events:none;z-index:0}
.W{max-width:1120px;margin:0 auto;padding:36px 20px 56px;position:relative;z-index:1}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#60a5fa,#a78bfa,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.sub{font-size:13px;color:var(--t2);max-width:760px;line-height:1.7;margin-bottom:32px}
/* tabs */
.TN{display:flex;gap:2px;margin-bottom:26px;background:var(--c1);border-radius:11px;padding:3px;border:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch}
.TB{padding:8px 16px;border:0;background:0;color:var(--t3);font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:8px;transition:.2s;white-space:nowrap}
.TB:hover{color:var(--t2);background:rgba(255,255,255,.04)}
.TB.on{color:var(--blue);background:rgba(96,165,250,.1)}
.TP{display:none;animation:fu .28s ease}.TP.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* scenario bar */
.SB{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.SI{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 12px;border-radius:10px;border:2px solid transparent;background:var(--c1);cursor:pointer;transition:.2s;min-width:76px;flex-shrink:0;font-family:inherit}
.SI:hover{background:var(--c2);border-color:rgba(255,255,255,.1)}
.SI.on{border-color:var(--blue);background:rgba(96,165,250,.08)}
.SI .ic{font-size:22px;line-height:1}
.SI .lb{font-size:9px;font-weight:600;color:var(--t3);text-align:center;line-height:1.25}
.SI.on .lb{color:var(--blue)}
/* category labels in scenario bar */
.SCAT{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;padding:9px 6px;flex-shrink:0;align-self:center;opacity:.5}
/* hero */
.H{border-radius:13px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.H::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}
.HC{position:relative;z-index:1}
.H h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:2px}
.H p{font-size:12px;color:rgba(255,255,255,.8)}
/* section divider inside detail */
.SD{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
/* grid */
.G2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.G3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:720px){.G2,.G3{grid-template-columns:1fr}}
.CD{background:var(--c1);border:1px solid var(--bd);border-radius:11px;padding:14px;transition:border-color .2s}
.CD:hover{border-color:rgba(255,255,255,.12)}
.CT{font-size:11px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.CT.am{color:var(--amber)}.CT.bl{color:var(--blue)}.CT.gn{color:var(--green)}.CT.pu{color:var(--purple)}.CT.rd{color:var(--red)}.CT.cy{color:var(--cyan)}.CT.pk{color:var(--pink)}.CT.sk{color:var(--sky)}.CT.sa{color:var(--sand)}.CT.sn{color:var(--snow)}
.DR{margin-bottom:10px}.DR:last-child{margin-bottom:0}
.DL{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);font-weight:700;margin-bottom:1px}
.DV{font-size:13px;font-weight:600;color:var(--t1);line-height:1.35}
.DS{font-size:10.5px;color:var(--t2);margin-top:1px;line-height:1.45}
/* tip box */
.BX{margin-top:16px;padding:13px 15px;border-radius:10px;font-size:11.5px;line-height:1.7}
.BX.bl{background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.14);color:var(--t2)}
.BX.am{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.14);color:var(--t2)}
.BX.gn{background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.14);color:var(--t2)}
.BX.pu{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.14);color:var(--t2)}
.BX.rd{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.14);color:var(--t2)}
.BT{font-weight:700;margin-bottom:4px;font-size:11.5px}
.BT.bl{color:var(--blue)}.BT.am{color:var(--amber)}.BT.gn{color:var(--green)}.BT.pu{color:var(--purple)}.BT.rd{color:var(--red)}.BT.cy{color:var(--cyan)}
/* table inside card */
.TW{overflow-x:auto;border-radius:9px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:11px}
thead tr{background:rgba(255,255,255,.04)}
th{padding:8px 10px;text-align:left;font-weight:700;color:var(--t3);font-size:9px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--bd)}
td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--t2)}
tr:nth-child(even){background:rgba(255,255,255,.015)}
td:first-child{color:var(--t1);font-weight:600}
/* badge */
.BG{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600}
.BG.am{background:rgba(245,158,11,.12);color:var(--amber)}.BG.gn{background:rgba(52,211,153,.12);color:var(--green)}.BG.bl{background:rgba(96,165,250,.12);color:var(--blue)}.BG.pu{background:rgba(167,139,250,.12);color:var(--purple)}.BG.rd{background:rgba(248,113,113,.12);color:var(--red)}
/* formula */
.FC{padding:16px;border-radius:10px;background:var(--c1);border:1px solid var(--bd);margin-bottom:12px}
.FC h3{font-size:13px;font-weight:700;margin-bottom:7px}
.FO{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--blue);padding:9px 12px;background:rgba(96,165,250,.07);border-radius:8px;margin-bottom:7px;overflow-x:auto}
.FV{font-size:10.5px;color:var(--t2);margin-bottom:2px}
.FE{font-size:10.5px;color:var(--green)}
.EG{display:grid;grid-template-columns:1fr 1fr;gap:4px}
@media(max-width:480px){.EG{grid-template-columns:1fr}}
.EI{display:flex;justify-content:space-between;padding:6px 9px;background:rgba(255,255,255,.03);border-radius:6px;font-size:10.5px}
.EI .ev{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--purple)}
/* workflow */
.WS{display:flex;gap:13px;align-items:flex-start;margin-bottom:18px;position:relative}
.WS:not(:last-child)::after{content:'';position:absolute;left:15px;top:36px;bottom:-10px;width:2px;background:linear-gradient(180deg,rgba(96,165,250,.3),rgba(167,139,250,.1))}
.WN{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 12px rgba(96,165,250,.2);position:relative;z-index:1}
.WC{flex:1;padding-top:1px}
.WC h4{font-size:13px;font-weight:700;margin-bottom:2px}
.WC p{font-size:11.5px;color:var(--t2);line-height:1.65}
.RT{font-size:11.5px;color:var(--t2);line-height:1.9}
.RT strong{color:var(--t1)}
input[type=number]{width:100%;padding:6px 8px;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:6px;color:var(--t1);font-size:12px;font-family:inherit;outline:0}
input:focus{border-color:var(--blue)}
.FT{margin-top:40px;padding-top:12px;border-top:1px solid var(--bd);text-align:center;font-size:9.5px;color:var(--t3);line-height:1.6}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:0}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
</style>
</head>
<body>
<div class="W">
<h1>UE5 物理灯光 (PBL) 完整参考 v3</h1>
<p class="sub">所有参数（Directional Light / Sky Light / Sky Atmosphere / 雾效 / 反射 / 后处理）统一整合到每个场景中。选择时段或天气条件，一次查看全部相关数值。</p>

<div class="TN" id="tnav"></div>

<!-- TAB: 场景 -->
<div id="t-scenes" class="TP on">
  <div class="SB" id="sbar"></div>
  <div id="sdet"></div>
</div>
<!-- TAB: 反射 -->
<div id="t-refl" class="TP"><div id="reflC"></div></div>
<!-- TAB: 单位 -->
<div id="t-units" class="TP"><div id="unitsC"></div></div>
<!-- TAB: 公式 -->
<div id="t-formula" class="TP"><div id="formulaC"></div></div>
<!-- TAB: 工作流 -->
<div id="t-flow" class="TP"><div id="flowC"></div></div>

<div class="FT">Epic Games文档 / Wikipedia EV / PBL Database (Arthur Tasquin) / Magnopus / Silicon Studio / NVIDIA GPU Gems<br>数值为参考范围，实际需根据艺术方向调整</div>
</div>

<script>
// ═══════════════════════════════════════════
// UNIFIED SCENARIO DATA
// ═══════════════════════════════════════════
const S=[
// ── TIME OF DAY ──
{cat:'时段',ic:'☀️',lb:'正午',sub:'Midday',ds:'太阳直射，最强光照',gr:'linear-gradient(180deg,#87CEEB,#f0e68c)',
 dir:{lux:'100,000–120,000',n:'晴天直射+天空',tp:'5500–6500K',td:'纯白偏冷',ag:'70°–90°',sh:'最短最硬 16:1(4档)',soft:'0.5°(真实太阳)',shaft:'可选'},
 sky:{i:'1.0',l:'8,000–12,000 cd/m²',c:'跟随大气(纯蓝)',rtc:'开启',lh:'自动'},

 fog:{d:'0.001–0.005',fo:'2.0–3.0',col:'天空色淡蓝',dist:'500–1000m',vf:'可选',ve:'0.5–1.0',vsd:'0.8–0.9',va:'1.0',second:'关闭'},
 refl:{note:'标准Roughness表现，金属/玻璃清晰反射',wet:'N/A',rough:'材质原始值'},
 exp:{ev:'14–16',t:'15',ap:'f/11–f/16',sh:'1/125–1/250',iso:'100',co:'0'},
 pp:{bl:'0.3–0.5',bt:'1.0',lf:'可选低',vig:'0.1–0.2',sat:'1.0',cg:'中性',extra:''},
 tip:'最简单的PBL场景。DirLight=120k lux，EV100≈15。正午SkyLight对阴影填充是Key/Fill比的关键。Sky Atmosphere默认值就是晴天正午。'},

{cat:'时段',ic:'🌅',lb:'黄金时刻',sub:'Golden Hour',ds:'日出后/日落前1h，电影感最佳',gr:'linear-gradient(180deg,#87CEEB,#FFA500 60%,#FF6347)',
 dir:{lux:'10,000–40,000',n:'穿过厚大气层',tp:'3000–4000K',td:'暖橙到金黄',ag:'10°–30°',sh:'拉长柔和 8:1(3档)',soft:'0.5–1.0°',shaft:'推荐(God Rays)'},
 sky:{i:'0.8–1.0',l:'2,000–6,000 cd/m²',c:'跟随大气(顶蓝底暖)',rtc:'开启',lh:'自动'},
 atmo:{rs:'1.0–1.5',rc:'默认',rh:'8km',ms:'2.0–4.0(增加光晕)',mc:'白偏暖(1,0.95,0.85)',mh:'1.2km',ma:'0.85–0.95(极强→大光晕)',mab:'偏暖(1,0.9,0.7)',multi:'1.0',ga:'0.2–0.3',abs:'1.0–1.5(增加→更红)'},
 fog:{d:'0.005–0.02',fo:'0.8–1.5',col:'暖金/橙',dist:'200–500m',vf:'推荐',ve:'1.0–1.5',vsd:'0.7–0.85',va:'1.0',second:'可选偏暖'},
 refl:{note:'暖色反射，金属表面偏金',wet:'N/A',rough:'材质原始值'},
 exp:{ev:'12–14',t:'13',ap:'f/8–f/11',sh:'1/60–1/125',iso:'100–200',co:'0~+0.5'},
 pp:{bl:'0.5–0.8',bt:'0.8',lf:'推荐(暖氛围)',vig:'0.2–0.3',sat:'1.0–1.1',cg:'Midtones偏暖',extra:'Light Shaft Bloom开启'},
 tip:'DirLight低角Pitch(-10°到-30°)，Mie Anisotropy提至0.9产生大太阳光晕。开Light Shaft Bloom + Volumetric Fog产生God Rays。'},

{cat:'时段',ic:'🌄',lb:'清晨',sub:'Sunrise',ds:'太阳刚升起',gr:'linear-gradient(180deg,#1a1a2e,#e94560 40%,#FFA500 80%,#FFD700)',
 dir:{lux:'400–1,000',n:'大气散射极强',tp:'2000–3000K',td:'深橙到红',ag:'0°–10°',sh:'极长柔软 4:1(2档)',soft:'1.0–2.0°',shaft:'推荐'},
 sky:{i:'0.5–0.8',l:'500–2,000 cd/m²',c:'跟随大气(暖紫)',rtc:'开启',lh:'自动'},
 atmo:{rs:'1.0',rc:'默认(自动处理)',rh:'8km',ms:'1.5–3.0',mc:'白偏暖',mh:'1.2km',ma:'0.8–0.9',mab:'默认',multi:'1.0',ga:'0.2',abs:'1.0'},
 fog:{d:'0.01–0.03',fo:'0.5–1.0',col:'暖粉/淡橙',dist:'100–300m',vf:'推荐(晨雾)',ve:'1.0–2.0',vsd:'0.6–0.8',va:'1.0',second:'推荐(低层晨雾)'},
 refl:{note:'暖色反射，水面反射朝霞色',wet:'可选晨露(Roughness降0.05)',rough:'材质原始或微降'},
 exp:{ev:'9–12',t:'11',ap:'f/4–f/8',sh:'1/30–1/60',iso:'200–400',co:'+0.5~+1.0'},
 pp:{bl:'0.8–1.2',bt:'0.6',lf:'梦幻感',vig:'0.2–0.3',sat:'1.0',cg:'Shadows偏紫蓝',extra:''},
 tip:'Sky Atmosphere自动处理天空过渡(底暖红顶冷蓝)。低层晨雾用Second Fog Layer(低Falloff+低Height)。手动调时SkyLight色调偏暖紫。'},

{cat:'时段',ic:'🌇',lb:'黄昏',sub:'Sunset',ds:'太阳落入地平线',gr:'linear-gradient(180deg,#2d1b69,#e94560 30%,#ff6b35 60%,#ffa62b)',
 dir:{lux:'400–1,000',n:'更多气溶胶→更红',tp:'1800–2500K',td:'深红到橙红',ag:'0°–5°',sh:'极长偏蓝紫',soft:'1.0–2.0°',shaft:'强烈推荐'},
 sky:{i:'0.4–0.7',l:'500–3,000 cd/m²',c:'跟随大气(暖红紫)',rtc:'开启',lh:'自动'},
 atmo:{rs:'1.0–1.5',rc:'默认',rh:'8km',ms:'3.0–5.0(比清晨更高)',mc:'偏暖(1,0.9,0.7)',mh:'1.2km',ma:'0.85–0.95',mab:'偏暖(1,0.8,0.5)',multi:'1.0',ga:'0.2–0.3',abs:'1.0–1.5'},
 fog:{d:'0.01–0.05',fo:'0.5–1.0',col:'暖橙/红',dist:'100–300m',vf:'推荐',ve:'1.5–2.5',vsd:'0.7–0.85',va:'1.0',second:'推荐偏红'},
 refl:{note:'强暖色反射，水面呈现金红色',wet:'N/A',rough:'材质原始值'},
 exp:{ev:'9–12',t:'11',ap:'f/4–f/8',sh:'1/30–1/60',iso:'200–400',co:'+0.5~+1.5'},
 pp:{bl:'1.0–1.5',bt:'0.5',lf:'强烈推荐',vig:'0.3–0.4',sat:'1.1–1.2',cg:'Gain偏暖橙',extra:'Volumetric Cloud最有表现力'},
 tip:'比清晨更饱和(更多气溶胶)。Mie Scale 3-5 + Anisotropy 0.9+。Sky Atmosphere的Mie Absorption偏暖可增强红色。Volumetric Cloud此时最美。'},

{cat:'时段',ic:'🌆',lb:'暮光',sub:'Twilight / Blue Hour',ds:'日落后天完全黑之前',gr:'linear-gradient(180deg,#0c0c3a,#2d1b69 30%,#e94560 70%,#ff8c69)',
 dir:{lux:'1–400',n:'太阳在地平线以下',tp:'7000–12000K',td:'冷蓝深紫',ag:'太阳-1°到-18°',sh:'几乎无影',soft:'5°+',shaft:'关闭'},
 sky:{i:'0.2–0.5',l:'100–1,000 cd/m²',c:'冷蓝偏紫',rtc:'开启',lh:'深蓝灰'},
 atmo:{rs:'1.0',rc:'默认',rh:'8km',ms:'1.0',mc:'默认',mh:'1.2km',ma:'0.8',mab:'默认',multi:'1.0–1.5(补偿暗度)',ga:'0.15',abs:'1.0'},
 fog:{d:'0.005–0.02',fo:'0.5–1.0',col:'冷蓝灰',dist:'200–500m',vf:'推荐',ve:'1.0–1.5',vsd:'0.5–0.7',va:'1.0',second:'可选'},
 refl:{note:'人工灯光成为主要反射来源',wet:'N/A',rough:'材质原始值'},
 exp:{ev:'5–9',t:'7',ap:'f/2.8–f/4',sh:'1/8–1/30',iso:'400–1600',co:'+1~+2'},
 pp:{bl:'0.5–0.8',bt:'0.3',lf:'可选',vig:'0.3–0.4',sat:'0.8–0.9',cg:'Shadows偏深蓝',extra:'人工光Bloom突出'},
 tip:'城市夜景经典时段——天空有余光但灯已亮。DirLight极低或关闭，靠SkyLight+人工光源(Point/Spot)照明。人工灯具用真实lm值(路灯3000-5000lm，霓虹灯自发光cd/m²)。'},

{cat:'时段',ic:'🌙',lb:'夜晚',sub:'Moonlit Night',ds:'满月或无月',gr:'linear-gradient(180deg,#000011,#0a0a2e 50%,#1a1a4e)',
 dir:{lux:'0.1–0.5(月光，可艺术化提亮)',n:'真实满月≈0.25lux',tp:'4100K(月光)',td:'冷白偏蓝(人眼感知)',ag:'月亮位置',sh:'满月有微弱阴影',soft:'0.5°',shaft:'可选(月光柱)'},
 sky:{i:'0.01–0.1',l:'0.001–0.01 cd/m²',c:'深蓝/黑',rtc:'开启',lh:'黑色'},
 atmo:{rs:'1.0',rc:'默认',rh:'8km',ms:'1.0',mc:'默认',mh:'1.2km',ma:'0.8',mab:'默认',multi:'1.0',ga:'0.05(暗地面)',abs:'1.0'},
 fog:{d:'0.002–0.01',fo:'0.5–1.5',col:'深蓝灰',dist:'300–800m',vf:'推荐(月光散射)',ve:'0.5–1.0',vsd:'0.3–0.5',va:'1.0',second:'可选(低层夜雾)'},
 refl:{note:'人工光源成为主要反射来源，月光下水面有冷蓝反射',wet:'N/A',rough:'材质原始值'},
 exp:{ev:'-6~-2',t:'-3',ap:'f/1.4–f/2.8',sh:'1/4–数秒',iso:'1600–6400',co:'+2~+4'},

const TABS=[
  {id:'scenes',label:'🎬 场景全参数'},
  {id:'refl',label:'🪞 反射系统'},
  {id:'units',label:'💡 灯光单位'},
  {id:'formula',label:'🔢 公式换算'},
  {id:'flow',label:'📋 工作流'},
];

function initTabs(){
  document.getElementById('tnav').innerHTML=TABS.map(t=>`<button class="TB ${t.id==='scenes'?'on':''}" data-t="${t.id}">${t.label}</button>`).join('');
  document.querySelectorAll('.TB').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.TB').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.TP').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');document.getElementById('t-'+b.dataset.t).classList.add('on');
  });
}

// ── Scenario Bar with category labels ──
let si=0;
function buildBar(){
  let html='',lastCat='';
  S.forEach((s,i)=>{
    if(s.cat!==lastCat){html+=`<div class="SCAT">${s.cat}</div>`;lastCat=s.cat;}
    html+=`<button class="SI ${i===si?'on':''}" onclick="setS(${i})"><span class="ic">${s.ic}</span><span class="lb">${s.lb}<br><span style="font-size:8px;font-weight:400;opacity:.65">${s.sub}</span></span></button>`;
  });
  document.getElementById('sbar').innerHTML=html;
}

function setS(i){si=i;buildBar();renderS();}

function R(label,val,sub){return `<div class="DR"><div class="DL">${label}</div><div class="DV">${val}</div>${sub?'<div class="DS">'+sub+'</div>':''}</div>`;}

function renderS(){
  const s=S[si],d=s.dir,k=s.sky,a=s.atmo,f=s.fog,r=s.refl,e=s.exp,p=s.pp;
  let h=`<div class="H" style="background:${s.gr}"><div class="HC"><h2>${s.ic} ${s.lb} ${s.sub}</h2><p>${s.ds}</p></div></div>`;

  // ── Section 1: Light Sources ──
  h+=`<div class="SD">光源</div><div class="G2">`;
  h+=`<div class="CD"><div class="CT am">☀️ Directional Light</div>
    ${R('强度 (Lux)',d.lux,d.n)}${R('色温',d.tp,d.td)}${R('角度',d.ag)}${R('阴影',d.sh)}${R('Source Soft Angle',d.soft)}${R('Light Shaft',d.shaft)}</div>`;
  h+=`<div class="CD"><div class="CT bl">🌤 Sky Light</div>
    ${R('Intensity',k.i,k.l)}${R('颜色',k.c)}${R('Real Time Capture',k.rtc)}${R('Lower Hemisphere',k.lh)}</div>`;
  h+=`</div>`;

  // ── Section 2: Atmosphere ──
  h+=`<div class="SD">天空大气 Sky Atmosphere</div><div class="G2">`;
  h+=`<div class="CD"><div class="CT sk">🔵 Rayleigh 散射（空气分子）</div>
    ${R('Scattering Scale',a.rs)}${R('Scattering Color',a.rc)}${R('Exp. Distribution',a.rh)}</div>`;
  h+=`<div class="CD"><div class="CT am">🟠 Mie 散射（气溶胶/尘埃）</div>
    ${R('Scattering Scale',a.ms)}${R('Scattering Color',a.mc)}${R('Exp. Distribution',a.mh)}${R('Anisotropy (Phase)',a.ma)}${R('Absorption',a.mab)}</div>`;
  h+=`</div><div class="G3" style="margin-top:12px">`;
  h+=`<div class="CD"><div class="CT gn">Multi Scattering</div>${R('值',a.multi)}</div>`;
  h+=`<div class="CD"><div class="CT gn">Ground Albedo</div>${R('值',a.ga)}</div>`;
  h+=`<div class="CD"><div class="CT gn">Absorption Scale</div>${R('值',a.abs)}</div>`;
  h+=`</div>`;

  // ── Section 3: Fog ──
  h+=`<div class="SD">雾效 Exponential Height Fog + Volumetric</div><div class="G2">`;
  h+=`<div class="CD"><div class="CT gn">📊 Height Fog</div>
    ${R('Fog Density',f.d)}${R('Height Falloff',f.fo)}${R('Inscattering Color',f.col)}${R('Start Distance',f.dist)}${R('Second Fog Layer',f.second)}</div>`;
  h+=`<div class="CD"><div class="CT cy">🌀 Volumetric Fog</div>
    ${R('启用',f.vf)}${R('Extinction Scale',f.ve,'光线衰减/遮蔽量')}${R('Scattering Distribution',f.vsd,'0=均匀 1=前向')}${R('Albedo',f.va,'水/冰≈1.0')}</div>`;
  h+=`</div>`;

  // ── Section 4: Reflections ──
  h+=`<div class="SD">反射影响</div><div class="CD">`;
  h+=`<div class="CT pu">🪞 反射特征</div>
    ${R('总体表现',r.note)}${R('湿润/Wetness',r.wet)}${R('Roughness调整',r.rough)}`;
  h+=`</div>`;

  // ── Section 5: Exposure ──
  h+=`<div class="SD">曝光 Post Process Volume</div><div class="G2">`;
  h+=`<div class="CD"><div class="CT gn">📷 曝光参数</div>
    ${R('EV100',e.ev,'推荐: '+e.t)}${R('光圈',e.ap)}${R('快门',e.sh)}${R('ISO',e.iso)}${R('曝光补偿',e.co)}</div>`;
  h+=`<div class="CD"><div class="CT pk">🎨 后处理</div>
    ${R('Bloom Intensity',p.bl)}${R('Bloom Threshold',p.bt)}${R('Lens Flare',p.lf)}${R('Vignette',p.vig)}${R('Saturation',p.sat)}${R('Color Grading',p.cg)}${p.extra?R('额外',p.extra):''}</div>`;
  h+=`</div>`;

  // ── Tip ──
  h+=`<div class="BX bl"><div class="BT bl">💡 实践建议</div>${s.tip}</div>`;

  document.getElementById('sdet').innerHTML=h;
}

      <tr><td>蜡烛</td><td>12</td><td>~1</td><td>1800K</td><td>1–4</td></tr>
      <tr><td>台灯40W</td><td>450</td><td>~36</td><td>2700K</td><td>5–7</td></tr>
      <tr><td>吊灯60W</td><td>800</td><td>~64</td><td>2700–3000K</td><td>7–8</td></tr>
      <tr><td>办公荧光灯</td><td>3200</td><td>~255</td><td>4000–5000K</td><td>8–9</td></tr>
      <tr><td>射灯</td><td>500–1000</td><td>角度相关</td><td>3000–5000K</td><td>7–10</td></tr>
    </tbody></table></div>
  <div class="CD" style="margin-top:16px"><div class="CT am">单位关系</div><div class="RT">
    <strong>lm→cd：</strong>点光源 cd=lm/(4π)；Spot cd=lm/(2π(1-cos(半角)))<br>
    <strong>差距：</strong>太阳≈120k lux, 60W灯泡≈800lm(64cd)，差距60–1000×
  </div></div>
  <div class="CD" style="margin-top:12px"><div class="CT pu">色温色带</div>
    <div style="margin-top:8px;height:32px;border-radius:8px;overflow:hidden;display:flex">
      <div style="flex:1;background:#ff8a2e" title="1800K"></div><div style="flex:1;background:#ffab4e" title="2700K"></div>
      <div style="flex:1;background:#ffc573" title="3000K"></div><div style="flex:1;background:#ffd9a0" title="3500K"></div>
      <div style="flex:1;background:#fff1d6" title="4100K"></div><div style="flex:1;background:#fff8ed" title="5000K"></div>
      <div style="flex:1;background:#fff9f4" title="5500K"></div><div style="flex:1;background:#f0f4ff" title="6500K"></div>
      <div style="flex:1;background:#d6e4ff" title="7500K"></div><div style="flex:1;background:#b8d0ff" title="10000K"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-top:4px;padding:0 2px"><span>1800K蜡烛</span><span>2700K灯泡</span><span>4100K自然白</span><span>5500K正午</span><span>6500K阴天</span><span>10000K蓝天</span></div>
  </div>`;
}

// ── Formula Panel ──
function renderFormula(){
  document.getElementById('formulaC').innerHTML=`
  <div class="FC"><h3>EV100</h3><div class="FO">EV100 = log₂( N² / t × 100 / S )</div><div class="FV">N=光圈 t=快门(s) S=ISO</div><div class="FE">f/8, 1/125s, ISO100 → ≈13</div></div>
  <div class="FC"><h3>Lux → EV100</h3><div class="FO">EV100 = log₂( E × 100 / 250 )</div><div class="FV">E=照度(lux)</div><div class="FE">100,000 lux → ≈15.3</div></div>
  <div class="FC"><h3>UE曝光</h3><div class="FO">Exposure = 1 / ( 1.2 × 2^EV100 )</div><div class="FV">UE内部亮度缩放</div><div class="FE">EV100=15 → ≈0.0000254</div></div>
  <div class="BX pu" style="margin-top:18px"><div class="BT pu">EV100 速查</div>
    <div class="EG" style="margin-top:7px">
      <div class="EI"><span class="ev">-6 ~ -2</span><span>月光</span></div>
      <div class="EI"><span class="ev">-2 ~ 4</span><span>夜间人工光</span></div>
      <div class="EI"><span class="ev">4 ~ 8</span><span>室内</span></div>
      <div class="EI"><span class="ev">9 ~ 11</span><span>日出/日落</span></div>
      <div class="EI"><span class="ev">12 ~ 14</span><span>阴天/Golden</span></div>
      <div class="EI"><span class="ev">14 ~ 16</span><span>晴天正午</span></div>
    </div></div>
  <div class="CD" style="margin-top:18px"><div class="CT bl">🧮 计算器</div>
    <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div><div class="DL">光圈 f/</div><input id="cA" type="number" value="8" step=".1" oninput="cEV()"></div>
      <div><div class="DL">快门 1/x</div><input id="cS" type="number" value="125" step="1" oninput="cEV()"></div>
      <div><div class="DL">ISO</div><input id="cI" type="number" value="100" step="100" oninput="cEV()"></div>
    </div>
    <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><div class="DL">Lux</div><input id="cL" type="number" value="100000" step="1000" oninput="cLux()"></div>
      <div style="display:flex;align-items:flex-end"><div id="cR" style="padding:6px 10px;background:rgba(96,165,250,.07);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--blue);width:100%;text-align:center;border:1px solid rgba(96,165,250,.2)">EV100 = 13.0</div></div>
    </div></div>`;
}
function cEV(){const N=parseFloat(document.getElementById('cA').value)||8,t=1/(parseFloat(document.getElementById('cS').value)||125),I=parseFloat(document.getElementById('cI').value)||100;document.getElementById('cR').textContent='EV100 = '+(Math.log2(N*N/t*100/I)).toFixed(1);}
function cLux(){const l=parseFloat(document.getElementById('cL').value)||0;if(l<=0){document.getElementById('cR').textContent='—';return;}document.getElementById('cR').textContent='EV100 ≈ '+(Math.log2(l*100/250)).toFixed(1)+' (Lux)';}

// ── Flow Panel ──
function renderFlow(){
  const steps=[
    ['项目设置','Extend Default Luminance Range开启(5.1+默认)'],
    ['PPV曝光','Manual模式，锁定Min/Max EV100(正午≈15，室内≈7)'],
    ['Directional Light','根据场景设Lux+色温+角度，开启Atmosphere Sun Light'],
    ['Sky Light','Real Time Capture，Intensity根据场景调节'],
    ['Sky Atmosphere','Rayleigh=天空颜色 / Mie=雾霾+散射 / Ground Albedo=地面反射'],
    ['Height Fog + Volumetric','Density/Falloff/Color根据天气调节，Volumetric的Extinction控制遮蔽'],
    ['人工光源','真实lm/cd值，Inverse Squared Falloff=On，用色温'],
    ['反射','Lumen质量设置，放置Reflection Captures作回退'],
    ['后处理','Tone Mapper(ACES) / Bloom / Color Grading / Local Exposure'],
  ];
  let h=`<p class="sub" style="margin-bottom:18px"><strong style="color:var(--t1)">先曝光 → 光源 → 大气 → 雾 → 反射 → 后处理</strong></p>`;
  steps.forEach((s,i)=>h+=`<div class="WS"><div class="WN">${i+1}</div><div class="WC"><h4>${s[0]}</h4><p>${s[1]}</p></div></div>`);
  h+=`<div class="BX rd" style="margin-top:12px"><div class="BT rd">⚠️ 常见陷阱</div>
    <strong>1.</strong> 100k lux+默认EV=全白 → 先设曝光<br>
    <strong>2.</strong> Auto Exposure干扰 → Manual锁定<br>
    <strong>3.</strong> Lux已含天空贡献 → DirLight略低于总Lux<br>
    <strong>4.</strong> 月光0.25lux太暗 → 可提至1-5lux<br>
    <strong>5.</strong> Mie Scale过高会吞噬DirLight色彩<br>
    <strong>6.</strong> Vol.Fog Albedo应≈1.0(水粒子)不要太低</div>`;
  h+=`<div class="BX bl" style="margin-top:14px"><div class="BT bl">🔗 完整参数链</div><div class="RT">
    <strong>DirLight(Lux)</strong> → 绝对亮度 → 决定EV100选择<br>
    <strong>EV100</strong> → 画面亮度 → 光圈/快门/ISO<br>
    <strong>SkyLight</strong> → 阴影填充 → 与DirLight比=对比度<br>
    <strong>Sky Atmosphere</strong> → Rayleigh=天空颜色 / Mie=雾霾散射<br>
    <strong>Height Fog</strong> → 大气密度 / Volumetric=光散射<br>
    <strong>Reflections</strong> → 受所有光源影响 / Roughness决定方式+成本<br>
    <strong style="color:var(--cyan)">光源 → 曝光 → 大气 → 雾 → 反射 → 后处理 = 完整链路</strong>
  </div></div>`;
  document.getElementById('flowC').innerHTML=h;
}

// ── INIT ──
initTabs();buildBar();renderS();renderRefl();renderUnits();renderFormula();renderFlow();cEV();
</script>
